[project]
name = "enterprise-rag-platform"
version = "0.1.0"
description = "Enterprise Knowledge Assistant (EKA) - RAG Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.30",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.3.1",
    "python-multipart>=0.0.9",
    "redis>=5.0.4",
    "alembic>=1.13.1",
    "aioboto3>=13.1.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "email-validator>=2.1.0.post1",
    "python-jose[cryptography]>=3.3.0",
    "celery[redis]>=5.4.0",
    "flower>=2.0.1",
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "unstructured[pdf]>=0.14.0",
    "langchain-text-splitters>=0.2.0",
    "openai>=1.30.0",
    "langchain-experimental>=0.0.60",
    "google-generativeai>=0.5.0",
    "tenacity>=8.3.0",
    "PyYAML>=6.0.1",
    "Jinja2>=3.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pre-commit>=3.7.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["S101"]
"tests/*" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
