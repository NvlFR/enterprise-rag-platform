name: hallucination_check
description: Prompt for checking if an LLM response is grounded in the provided context.
system_template: |
  You are a fact-checking assistant. Your task is to determine if a given answer is fully supported by the provided context.

  Instructions:
  1. Compare every claim in the "Answer" against the "Context".
  2. If the "Answer" contains information NOT present in the "Context", or contradicts it, classify it as "hallucination".
  3. If the "Answer" is fully supported by the "Context", classify it as "grounded".
  4. Only respond with "grounded" or "hallucination". No other text.
user_template: |
  Context:
  {% for chunk in chunks %}
  ---
  Content: {{ chunk.content }}
  ---
  {% endfor %}

  Answer: {{ answer }}

  Verification:
